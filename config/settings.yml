# Determines the environment that cocina metadata will be fetched from; for
# stage indexing it should be set to staging PURL
purl:
  hostname: purl.stanford.edu

# Should be purl_fetcher_stage or purl_fetcher_prod; determines which queue
# of SDR item updates we are 'listening' to
indexer_topic: purl_fetcher_prod

# Kafka groups split messages across consumers; we set this to something for
# local dev so we don't 'steal' messages from stage/prod consumers
indexer_group: dataworks-dev-indexer

# Settings for reporting indexing status to SDR; turned off in local dev.
# The messages appear in the event log in Argo
sdr_events:
  enabled: false
  mq:
    vhost: /
    hostname: localhost
    username: guest
    password: guest

