name: dataworks-etl
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dataworks_etl_rails
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data

  solr:
    image: solr:9.6.1
    volumes:
      - index:/var/solr
      # Use the solr config from the DWExperimentsBlacklight repo
      # If the repos aren't stored in the same parent directory, this will error
      - ../DWExperimentsBlacklight/solr/conf:/solr-setup/conf
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - dataworks
      - /solr-setup/conf
    ports:
      - 8983:8983

volumes:
  postgres-data:
  index:
